<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Async Data Loader</title>

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <main class="container">
    <h1>Tips Belajar JavaScript</h1>

    <p
      id="status"
      role="status"
      aria-live="polite">
      Tekan tombol untuk memuat data.
    </p>

    <button id="muat-data" type="button">
      Muat Data
    </button>

    <button id="coba-lagi" type="button" hidden>
      Coba Lagi
    </button>

    <section
      id="hasil"
      aria-label="Tips belajar">
    </section>
  </main>

</body>
</html>
